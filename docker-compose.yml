services:
  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: host.docker.internal
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
    env_file: .env
    environment:
      BACKEND_BASE_URL: http://api:8000/api/v1
    depends_on:
      - api
    ports:
      - "8501:8501"
